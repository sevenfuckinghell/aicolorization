version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: colorrevive-backend
    container_name: colorrevive-api
    ports:
      - "8000:8000"
    environment:
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      MODEL_CHECKPOINT_PATH: /app/checkpoints/colorization.pt
      MODEL_NAME: ${MODEL_NAME:-unet-lab-v1}
      DEVICE: ${DEVICE:-auto}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-25000000}
      INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-60}
      ENABLE_FALLBACK_MODE: ${ENABLE_FALLBACK_MODE:-true}
      ENABLE_PERSISTENT_STORAGE: ${ENABLE_PERSISTENT_STORAGE:-false}
      RESPONSE_MODE: ${RESPONSE_MODE:-base64}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Mount a trained checkpoint without rebuilding the image:
      #   mkdir -p checkpoints && cp your-model.pt checkpoints/colorization.pt
      - ./checkpoints:/app/checkpoints:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: colorrevive-frontend
    container_name: colorrevive-web
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
